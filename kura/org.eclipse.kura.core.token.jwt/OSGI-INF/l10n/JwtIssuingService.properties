name=JWT Issuing Service
description=The JwtIssuingService issues JSON Web Tokens. Tokens are signed with RS256, using an RSA private key and verified against trusted certificates of a KeystoreService instance.
keystoreTargetFilter=Keystore Target Filter
keystoreTargetFilterDesc=Specifies, as an OSGi target filter, the pid of the KeystoreService that holds the private key entry used to sign issued tokens.
signingKeyAlias=Signing Key Alias
signingKeyAliasDesc=The alias of the RSA private key entry, in the configured key store, used to sign issued tokens. The alias is published as the 'kid' header of issued tokens, so that verifiers can select the matching certificate. If the alias cannot be resolved to an RSA private key entry, then token issuing will fail.
issuer=Issuer
issuerDesc=The issuer set as the 'iss' claim of issued tokens.
maxTokenLifetime=Maximum Token Lifetime (sec)
maxTokenLifetimeDesc=The upper bound, in seconds, on the lifetime of issued tokens. Token issue requests made with the expires at (exp) claim longer than this value will have exp claim set to this value. Set to 0 to accept any requested lifetime and to issue tokens without expiration when no lifetime is requested.
