name=JWT Verification Service
description=The JwtVerificationService verifies JSON Web Tokens. Can verify tokens are signed with RS256, using an RSA private key and are verified against trusted certificates of a KeystoreService instance.
truststoreTargetFilter=Truststore Target Filter
truststoreTargetFilterDesc=Specifies, as an OSGi target filter, the pid of the KeystoreService that holds the trusted certificates used for verifying tokens.
trustedIssuers=Trusted Issuers
trustedIssuersDesc=Comma-separated list of issuers accepted when verifying tokens, that is, the accepted values of the 'iss' claim. If left empty, the 'iss' claim is not checked.
verificationKeyAliases=Verification Key Aliases
verificationKeyAliasesDesc=Comma-separated list of trust store aliases whose certificates are accepted when verifying tokens. If left empty, every trusted certificate entry of the configured trust store that holds an RSA key is accepted. Restricting this list is recommended when the trust store is shared with TLS.
clockSkewTolerance=Clock Skew Tolerance (sec)
clockSkewToleranceDesc=The tolerance window, in seconds, applied to the 'exp', 'nbf' and 'iat' claims during verification, to compensate for clock drift between the issuer and the verifier.
requireValidCertificate=Require Valid Certificate
requireValidCertificateDesc=If enabled, a trust store certificate is used for verification only while it is within its own validity period, so an expired signing certificate stops validating tokens. If disabled, the certificate validity period is ignored and only the token claims are checked.
