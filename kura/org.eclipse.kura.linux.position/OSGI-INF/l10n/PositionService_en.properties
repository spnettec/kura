name=PositionService
description=The PositionService provides GPS positions for Kura.  The parameters define the serial port configuration of the device.
enabled=Enabled
enabledDesc=Whether or not to enable the PositionService
static=static
staticDesc=Specify static position instead of using GPS
provider=provider
providerDesc=Source for setting the position provider. Verify the availabiliy of the selected provider before activate it.
modemManagerRefreshRateSeconds=Modem Manager Refresh Rate (Seconds)
modemManagerRefreshRateSecondsDesc=Refresh time in seconds at which the position is updated when using the Modem Manager Position Provider
gpsdHost=Gpsd Host
gpsdHostDesc=Host where the gpsd service is running.
gpsdPort=Gpsd Port
gpsdPortDesc=Port where the gpsd service is running.
gpsdMaxFixValidityIntervalSeconds=Gpsd Max Fix Validity Interval (Seconds)
gpsdMaxFixValidityIntervalSecondsDesc=With some GPS receivers GPSD does not report to the clients that GPS fix has been lost. This parameter enables the following workaround: if no position updates are received from GPSD after the value of this parameter in seconds since last update, then the PositionService will assume that the GPS fix has been lost. Set to 0 to disable this feature.
latitude=latitude
latitudeDesc=Static latitude value in degrees
longitude=longitude
longitudeDesc=Static longitude value in degrees
altitude=altitude
altitudeDesc=Static altitude value in meters
gnssType=GNSS Type
gnssTypeDesc=GNSS system used to retrieve the static position information.
port=port
portDesc=The USB or serial port of the GPS device (e.g. 1-3.2 or /dev/ttyACM0). If the GPS device is provided by a modem, and it needs to be enabled from the network configuration section of the Web UI, this field must be left empty.
baudRate=baudRate
baudRateDesc=The baud rate of the GPS device.
bitsPerWord=bitsPerWord
bitsPerWordDesc=The number of bits per word or the 'data bits' for the serial communication to the GPS device.
stopBits=stopBits
stopBitsDesc=The stop bits for the serial communication to the GPS device.
parity=parity
parityDesc=The parity for the serial communication to the GPS device.

