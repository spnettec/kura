name=Login Banner
description=This component allows to enable and configure pre and post login banners that can be shown by Kura user interfaces.
preLoginBannerEnabled=Pre Login Banner Enabled
preLoginBannerEnabledDesc=If enabled, a customizable banner will be shown before user login.
preLoginBannerContent=Pre Login Banner Content
preLoginBannerContentDesc=The message to be shown in the pre login banner, if the feature is enabled.|TextArea
postLoginBannerEnabled=Post Login Banner Enabled
postLoginBannerEnabledDesc=If enabled, a customizable banner will be shown after successful user login.
postLoginBannerContent=Post Login Banner Content
postLoginBannerContentDesc=The message to be shown in the post login banner, if the feature is enabled.|TextArea