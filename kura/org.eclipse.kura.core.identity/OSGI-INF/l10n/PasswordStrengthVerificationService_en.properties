name=Password Strength
description=This component allows to configure the strength requirements for new passwords.
newPasswordMinLength=Minimum password length
newPasswordMinLengthDesc=The minimum length to be enforced for new passwords. Set to 0 to disable.
newPasswordRequireDigits=Require digits in new password
newPasswordRequireDigitsDesc=If set to true, new passwords will be accepted only if containing at least one digit.
newPasswordRequireSpecialCharacters=Require special characters in new password
newPasswordRequireSpecialCharactersDesc=If set to true, new passwords will be accepted only if containing at least one non alphanumeric character.
newPasswordRequireBothCases=Require uppercase and lowercase characters in new passwords
newPasswordRequireBothCasesDesc=If set to true, new passwords will be accepted only if containing both uppercase and lowercase alphanumeric characters.