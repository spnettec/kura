name=WebConsole
description=Web Console configuration. A change to this view will case the reload of the web server! Spurious error messages can be displayed during the restart.
username=Console Username
usernameDesc=Device's web username.
password=Console Password
passwordDesc=Device's web console password. A non empty value should be set.
root=Web Server Entry Point
rootDesc=This parameter allows to configure the relative path that the user will be redirected to when accessing http(s)://gateway-ip/. Note: this parameter does not change the ESF Web UI relative path, that is always /admin/console.
sessionMaxInactivityInterval=Session max inactivity interval
sessionMaxInactivityIntervalDesc=The session max inactivity interval in minutes. If no interaction with the Web UI is performed for the value of this parameter in minutes, a new login will be requested.
allowedPorts=Allowed ports
allowedPortsDesc=If set to a non empty list, Web Console access will be allowed only on the specified ports. If set to an empty list, access will be allowed on all ports. Please make sure that the allowed ports are open in HttpService and Firewall configuration.
authenticationMethodPasswordEnabled=Authentication Method "Password" Enabled
authenticationMethodPasswordEnabledDesc=Defines whether the "Password" authentication method is enabled or not
authenticationMethodCertificateEnabled=Authentication Method "Certificate" Enabled
authenticationMethodCertificateEnabledDesc=Defines whether the "Certificate" authentication method is enabled or not
sslManagerServiceTarget=SslManagerService Target Filter
sslManagerServiceTargetDesc=Specifies, as an OSGi target filter, the pid of the SslManagerService used to create HTTPS connections. This is needed for example for fetching package descriptions from Eclipse Marketplace.